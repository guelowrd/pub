<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pub bench</title>
<style>body{margin:0;background:#111;color:#eee;font:16px/1.5 monospace}canvas{position:fixed;inset:0;width:100vw;height:100vh}#out{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.7);padding:8px;white-space:pre}</style>
<canvas id="c"></canvas><div id="out">loading…</div>
<script>
// Frame-cost probe for a phone: which part of the game's draw is slow here. Open on the device, read the medians.
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), out = document.getElementById("out");
const dpr = Math.min(1.5, devicePixelRatio); cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
const W = cv.width, H = cv.height, lines = [`${navigator.userAgent.slice(0, 60)}`, `canvas ${W}x${H}`];
const say = (s) => { lines.push(s); out.textContent = lines.join("\n"); };
const BIG = ["traffic-van", "traffic-suv", "traffic-sedan", "traffic-rv", "traffic-bus", "traffic-convertible", "traffic-pickup", "traffic-taxi", "portraits-b", "portraits-c", "passengers-b", "passengers-c", "props-atlas", "buildings-atlas", "hero-spin", "fork-harbour-causeway", "fork-tower-podium", "fork-highway-overpass", "fork-wooded-ridge", "scenery-venues"].map((f) => `art/${f}.webp`);
const PANO = ["art/pano-waterfront.webp", "art/pano-casino.webp"], MAT = ["art/materials/downtown-asphalt-repeat.webp", "art/materials/downtown-verge-repeat.webp"];
const load = (src) => new Promise((ok, bad) => { const im = new Image(); im.src = src; im.decode().then(() => ok(im), () => bad(new Error(src))); });
const median = (a) => [...a].sort((x, y) => x - y)[a.length >> 1];
// run f once per animation frame, 45 frames, report the median of the last 40
const bench = (name, f) => new Promise((done) => { const ms = [], gaps = []; let n = 0, last = 0; const tick = (now) => { if (last) gaps.push(now - last); last = now; const t0 = performance.now(); f(n); ms.push(performance.now() - t0); if (++n < 45) requestAnimationFrame(tick); else { say(`${name}: js ${median(ms.slice(5)).toFixed(1)} ms, frame every ${median(gaps.slice(4)).toFixed(0)} ms`); done(); } }; requestAnimationFrame(tick); });
(async () => {
  const t0 = performance.now();
  const big = await Promise.all(BIG.map(load)), panos = await Promise.all(PANO.map(load)), mats = await Promise.all(MAT.map(load));
  say(`decode ${BIG.length + 4} files: ${(performance.now() - t0).toFixed(0)} ms (${big.reduce((a, im) => a + im.naturalWidth * im.naturalHeight * 4, 0) / 2 ** 20 | 0} MB rgba)`);
  await bench("A fill 10 screens", () => { for (let i = 0; i < 10; i++) { ctx.fillStyle = i & 1 ? "#223" : "#332"; ctx.fillRect(0, 0, W, H); } });
  await bench("B 60 sprite crops from 20 big sheets", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 60; i++) { const im = big[i % big.length]; ctx.drawImage(im, (i * 97) % 1800, (n * 13) % 1200, 200, 200, (i * 37) % W, (i * 53) % H, 100 * dpr, 100 * dpr); } });
  await bench("C 2 panos + 2 forks scaled", (n) => { for (const im of panos) ctx.drawImage(im, -n % 100, 0, W * 1.3, H * 0.4); for (const im of big.slice(15, 17)) ctx.drawImage(im, 0, H * 0.3, W, H * 0.5); });
  const pats = mats.map((im) => ctx.createPattern(im, "repeat"));
  await bench("D 140 road quads, pattern fills", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let s = 0; s < 70; s++) { const y1 = H - s * (H / 140), y2 = y1 - H / 140, k = (1 - s / 70); for (const pat of pats) { pat.setTransform({ a: k, b: 0, c: 0, d: -k, e: W / 2 + n, f: y1 }); ctx.save(); ctx.globalAlpha = 0.3; ctx.fillStyle = pat; ctx.beginPath(); ctx.moveTo(W / 2 - W * k * 0.4, y1); ctx.lineTo(W / 2 + W * k * 0.4, y1); ctx.lineTo(W / 2 + W * k * 0.38, y2); ctx.lineTo(W / 2 - W * k * 0.38, y2); ctx.fill(); ctx.restore(); } } });
  await bench("E 140 road quads, plain colour", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let s = 0; s < 140; s++) { const y1 = H - s * (H / 140), y2 = y1 - H / 140, k = 1 - s / 140; ctx.fillStyle = s & 1 ? "#333" : "#3a3a3a"; ctx.beginPath(); ctx.moveTo(W / 2 - W * k * 0.4 + n, y1); ctx.lineTo(W / 2 + W * k * 0.4, y1); ctx.lineTo(W / 2 + W * k * 0.38, y2); ctx.lineTo(W / 2 - W * k * 0.38, y2); ctx.fill(); } });
  await bench("F 160 rain streaks + screen pass", (n) => { ctx.save(); ctx.strokeStyle = "rgba(200,220,255,0.35)"; ctx.lineWidth = dpr; ctx.beginPath(); for (let i = 0; i < 160; i++) { const x = (i * 131 + n * 7) % W, y = (i * 71 + n * 23) % H; ctx.moveTo(x, y); ctx.lineTo(x + 4, y + 30); } ctx.stroke(); ctx.globalCompositeOperation = "screen"; ctx.globalAlpha = 0.3; ctx.drawImage(big[0], 0, 0, 2000, 1400, 0, 0, W, H); ctx.restore(); });
  await bench("G all of B+C+D+F together", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (const im of panos) ctx.drawImage(im, -n % 100, 0, W * 1.3, H * 0.4); for (let s = 0; s < 70; s++) { const y1 = H - s * (H / 140), y2 = y1 - H / 140, k = 1 - s / 70; for (const pat of pats) { pat.setTransform({ a: k, b: 0, c: 0, d: -k, e: W / 2 + n, f: y1 }); ctx.fillStyle = pat; ctx.beginPath(); ctx.moveTo(W / 2 - W * k * 0.4, y1); ctx.lineTo(W / 2 + W * k * 0.4, y1); ctx.lineTo(W / 2 + W * k * 0.38, y2); ctx.lineTo(W / 2 - W * k * 0.38, y2); ctx.fill(); } } for (let i = 0; i < 60; i++) { const im = big[i % big.length]; ctx.drawImage(im, (i * 97) % 1800, (n * 13) % 1200, 200, 200, (i * 37) % W, (i * 53) % H, 100 * dpr, 100 * dpr); } ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.globalAlpha = 0.3; ctx.drawImage(big[0], 0, 0, 2000, 1400, 0, 0, W, H); ctx.restore(); });
  const copies = big.map((im) => { const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext("2d").drawImage(im, 0, 0); return c; });
  await bench("H 60 sprite crops from 20 CANVAS copies", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 60; i++) { const im = copies[i % copies.length]; ctx.drawImage(im, (i * 97) % 1800, (n * 13) % 1200, 200, 200, (i * 37) % W, (i * 53) % H, 100 * dpr, 100 * dpr); } });
  const bitmaps = await Promise.all(copies.map((c) => createImageBitmap(c)));
  await bench("I 60 sprite crops from 20 ImageBitmaps", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 60; i++) { const im = bitmaps[i % bitmaps.length]; ctx.drawImage(im, (i * 97) % 1800, (n * 13) % 1200, 200, 200, (i * 37) % W, (i * 53) % H, 100 * dpr, 100 * dpr); } });
  const pc = ctx.createPattern(copies[0], "repeat");
  await bench("J 140 quads, pattern from a CANVAS", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let s = 0; s < 140; s++) { const y1 = H - s * (H / 140), y2 = y1 - H / 140, k = 1 - s / 140; pc.setTransform({ a: k * 0.2, b: 0, c: 0, d: -k * 0.2, e: W / 2 + n, f: y1 }); ctx.fillStyle = pc; ctx.beginPath(); ctx.moveTo(W / 2 - W * k * 0.4, y1); ctx.lineTo(W / 2 + W * k * 0.4, y1); ctx.lineTo(W / 2 + W * k * 0.38, y2); ctx.lineTo(W / 2 - W * k * 0.38, y2); ctx.fill(); } });
  const quad = (k, y1, y2, n) => { ctx.beginPath(); ctx.moveTo(W / 2 - W * k * 0.4 + n, y1); ctx.lineTo(W / 2 + W * k * 0.4, y1); ctx.lineTo(W / 2 + W * k * 0.38, y2); ctx.lineTo(W / 2 - W * k * 0.38, y2); };
  await bench("K 40 radial glows, lighter", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.globalCompositeOperation = "lighter"; for (let i = 0; i < 40; i++) { const x = (i * 131 + n * 3) % W, y = (i * 71) % H, r = 20 + (i % 5) * 20; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, "rgba(255,220,120,0.5)"); g.addColorStop(1, "rgba(255,220,120,0)"); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); } ctx.restore(); });
  await bench("L 40 linear-gradient cones, lighter", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.35; for (let i = 0; i < 40; i++) { const x = (i * 131 + n * 3) % W, y = (i * 71) % H; const g = ctx.createLinearGradient(x, y, x, y + 120); g.addColorStop(0, "rgba(255,244,200,0.45)"); g.addColorStop(1, "rgba(255,244,200,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60, y + 120); ctx.lineTo(x - 60, y + 120); ctx.fill(); } ctx.restore(); });
  await bench("M 40 plain alpha quads, lighter", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.3; ctx.fillStyle = "#62f3a4"; for (let i = 0; i < 40; i++) { quad(1 - i / 50, H - i * 12, H - i * 12 - 10, n); ctx.fill(); } ctx.restore(); });
  await bench("N 140 quads under 140 save/clip/restore", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 140; i++) { ctx.save(); quad(1 - i / 140, H - i * (H / 140), H - (i + 1) * (H / 140), n); ctx.clip(); ctx.fillStyle = i & 1 ? "#333" : "#3a3a3a"; ctx.fillRect(0, 0, W, H); ctx.restore(); } });
  await bench("O 200 stroked lines, lighter", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = "rgba(120,220,255,0.35)"; ctx.lineWidth = 1; for (let i = 0; i < 200; i++) { ctx.beginPath(); ctx.moveTo((i * 37 + n) % W, 0); ctx.lineTo((i * 53) % W, H); ctx.stroke(); } ctx.restore(); });
  await bench("P 3 full-screen gradient sheens, lighter", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.globalCompositeOperation = "lighter"; for (let i = 0; i < 3; i++) { const g = ctx.createLinearGradient(0, H * 0.4, 0, H); g.addColorStop(0, "rgba(255,79,208,0)"); g.addColorStop(0.5, "rgba(255,79,208,0.2)"); g.addColorStop(1, "rgba(255,79,208,0)"); ctx.fillStyle = g; ctx.fillRect(0, H * 0.4, W, H * 0.6); } ctx.restore(); });
  await bench("Q 60 sprites + 1 full-screen rect, screen composite", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.globalCompositeOperation = "screen"; for (let i = 0; i < 60; i++) { const im = big[i % big.length]; ctx.globalAlpha = 0.6; ctx.drawImage(im, (i * 97) % 1800, (n * 13) % 1200, 200, 200, (i * 37) % W, (i * 53) % H, 100 * dpr, 100 * dpr); } ctx.restore(); });
  await bench("R 2200 small path quads, plain fill", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 2200; i++) { const x = (i * 37 + n) % W, y = (i * 53) % H; ctx.fillStyle = i & 1 ? "#333" : "#3a3a3a"; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 30, y); ctx.lineTo(x + 28, y + 4); ctx.lineTo(x + 2, y + 4); ctx.fill(); } });
  await bench("S 2200 small fillRects", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 2200; i++) { const x = (i * 37 + n) % W, y = (i * 53) % H; ctx.fillStyle = i & 1 ? "#333" : "#3a3a3a"; ctx.fillRect(x, y, 30, 4); } });
  await bench("T 550 path quads + 400 save/restore", (n) => { ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 550; i++) { const x = (i * 37 + n) % W, y = (i * 53) % H; if (i < 400) ctx.save(); ctx.fillStyle = i & 1 ? "#333" : "#3a3a3a"; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 30, y); ctx.lineTo(x + 28, y + 4); ctx.lineTo(x + 2, y + 4); ctx.fill(); if (i < 400) ctx.restore(); } });
  say("done. send these numbers back.");
})().catch((e) => say(`error: ${e.message}`));
</script>
