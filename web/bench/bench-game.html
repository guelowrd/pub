<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pub bench game</title>
<style>body{margin:0;background:#111;color:#eee;font:15px/1.4 monospace}canvas{position:fixed;inset:0;width:100vw;height:100vh}#out{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.7);padding:8px;white-space:pre}</style>
<canvas id="c"></canvas><div id="out">loading…</div>
<script type="module">
// The real game loop without React, the HUD or audio: loads the art, grows a course, then runs
// 6 s each of (1) draw only, (2) sim only, (3) both. Reports the frame interval and the JS time per frame.
import { newSim, step } from "/src/game/sim.ts";
import { extend } from "/src/game/course.ts";
import { draw, setSong } from "/src/game/render.ts";
import { loadArt, loadLight, loadLook } from "/src/game/art.ts";
import { STATIONS } from "/src/game/stations.ts";
const song = Number(new URLSearchParams(location.search).get("song") ?? 8), STEP = 1 / 120;
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), out = document.getElementById("out");
const dpr = Math.min(1.5, devicePixelRatio); cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
const lines = [navigator.userAgent.slice(13, 50), `canvas ${cv.width}x${cv.height}  song ${STATIONS[song].id}`];
const say = (s) => { lines.push(s); out.textContent = lines.join("\n"); };
const median = (a) => [...a].sort((x, y) => x - y)[a.length >> 1];
const inp = { gas: true, brake: false, left: false, right: false };
const counts = {}; let counting = false, off = "";
// bisect by operation kind: with `off` set, that kind of call does nothing (or falls back to a flat colour)
const P = CanvasRenderingContext2D.prototype;
for (const n of ["fill", "fillRect", "drawImage", "stroke", "clip"]) { const d = Object.getOwnPropertyDescriptor(P, n); Object.defineProperty(P, n, { ...d, value: function (...a) { if (off === n) return; return d.value.apply(this, a); } }); }
// patterns remember their repetition (repeat-x = the frontage bands, repeat = road materials and tunnel), and their transforms can be tamed
{ const cp = P.createPattern; P.createPattern = function (im, rep) { const pat = cp.call(this, im, rep); pat.rep = rep; return pat; }; }
{ const st = CanvasPattern.prototype.setTransform; CanvasPattern.prototype.setTransform = function (m) { if (off === "skew") m = { ...m, b: 0, c: 0 }; if (off === "flip") m = { ...m, d: Math.abs(m.d) }; if (off === "tiny" && Math.abs(m.a) < 0.02) m = { ...m, a: Math.sign(m.a || 1) * 0.02, d: Math.sign(m.d || 1) * 0.02 }; return st.call(this, m); }; }
{ const d = Object.getOwnPropertyDescriptor(P, "fillStyle"); Object.defineProperty(P, "fillStyle", { ...d, set(v) { if (v instanceof CanvasPattern && (off === "pattern" || (off === "frontage" && v.rep === "repeat-x") || (off === "materials" && v.rep !== "repeat-x"))) v = "#444"; if (off === "gradient" && v instanceof CanvasGradient) v = "#444"; d.set.call(this, v); } }); }
{ const d = Object.getOwnPropertyDescriptor(P, "globalCompositeOperation"); Object.defineProperty(P, "globalCompositeOperation", { ...d, set(v) { if (off === "lighter" && v !== "source-over") v = "source-over"; d.set.call(this, v); } }); }
for (const n of Object.getOwnPropertyNames(CanvasRenderingContext2D.prototype)) { const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, n); if (typeof d?.value !== "function") continue; CanvasRenderingContext2D.prototype[n] = function (...a) { if (counting) counts[n] = (counts[n] ?? 0) + 1; return d.value.apply(this, a); }; }
{ const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, "globalCompositeOperation"); Object.defineProperty(CanvasRenderingContext2D.prototype, "globalCompositeOperation", { ...d, set(v) { if (counting) counts["gco=" + v] = (counts["gco=" + v] ?? 0) + 1; d.set.call(this, v); } }); }
const run = (name, f) => new Promise((done) => {
  const gaps = [], work = []; let last = 0, t0 = performance.now();
  const tick = (now) => { if (last) gaps.push(now - last); last = now; const a = performance.now(); f(); work.push(performance.now() - a); if (now - t0 < 3500) requestAnimationFrame(tick); else { say(`${name}: frame every ${median(gaps).toFixed(0)} ms`); done(); } };
  requestAnimationFrame(tick);
});
(async () => {
  let t = performance.now();
  await loadArt(); await loadLight(STATIONS[song].time); await loadLook(STATIONS[song]);
  say(`art loaded: ${(performance.now() - t).toFixed(0)} ms`);
  const s = newSim(7, song); setSong(STATIONS[song].id); extend(s);
  for (let i = 0; i < 3 * 120; i++) step(s, inp, STEP, extend); // 3 s in, the car moving
  counting = true; draw(ctx, s, cv.width, cv.height); counting = false;
  say(`low tier ${location.search.includes("low") ? "ON" : "off"}, one frame: ` + Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v}`).join(", "));
  for (const kind of ["", "pattern", "frontage", "materials", "skew", "flip", "tiny"]) { off = kind; await run(kind ? `without ${kind}` : "full draw", () => draw(ctx, s, cv.width, cv.height)); }
  off = "";
  say("done. send these numbers back.");
})().catch((e) => say(`error: ${e.message}\n${e.stack?.slice(0, 300)}`));
</script>
