<title>pub bench app</title>
<script>
// The real game with a stopwatch on every frame: where the JS goes (canvas, HUD innerHTML, audio, the rest) and how much
// game time passes per real second (1.0 = real time). Drive a stage as usual; the box top left updates every second.
(() => {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:4px;top:4px;z-index:99999;background:rgba(0,0,0,.75);color:#8f8;font:11px/1.25 monospace;padding:3px;opacity:.85;white-space:pre;pointer-events:none";
  addEventListener("DOMContentLoaded", () => { document.body.appendChild(box); if (location.search.includes("nohud")) { const st = document.createElement("style"); st.textContent = ".hud, .pad { display: none !important }"; document.head.appendChild(st); } });
  let resizes = 0; for (const n of ['width', 'height']) { const d = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, n); Object.defineProperty(HTMLCanvasElement.prototype, n, { ...d, set(v) { resizes++; d.set.call(this, v); } }); }
  if (location.search.includes('nochain')) { const f = fetch.bind(self); self.fetch = (u, o) => String(u).startsWith(location.origin) || String(u).startsWith('/') ? f(u, o) : Promise.reject(new Error('nochain')); self.WebSocket = class { constructor() { throw new Error('nochain'); } }; }
  if (location.search.includes('noaudio')) HTMLMediaElement.prototype.play = () => Promise.resolve();
  let blocked = 0, tickAt = performance.now(); setInterval(() => { const n = performance.now(); blocked += Math.max(0, n - tickAt - 10); tickAt = n; }, 10);
  let canvasMs = 0, htmlMs = 0, audioMs = 0, frameMs = 0, frames = 0, gaps = [], worst = 0, lastRaf = 0, lastT = -1, lastWall = performance.now(), log = [];
  const wrap = (proto, names, bucket) => { for (const n of names) { const d = Object.getOwnPropertyDescriptor(proto, n); if (!d) continue;
    if (d.value) proto[n] = function (...a) { const t = performance.now(); try { return d.value.apply(this, a); } finally { bucket(performance.now() - t); } };
    else if (d.set) Object.defineProperty(proto, n, { ...d, set(v) { const t = performance.now(); try { d.set.call(this, v); } finally { bucket(performance.now() - t); } } }); } };
  wrap(CanvasRenderingContext2D.prototype, Object.getOwnPropertyNames(CanvasRenderingContext2D.prototype).filter((n) => typeof Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, n)?.value === "function"), (ms) => canvasMs += ms);
  wrap(Element.prototype, ["innerHTML"], (ms) => htmlMs += ms);
  if (self.AnalyserNode) wrap(AnalyserNode.prototype, ["getByteFrequencyData", "getByteTimeDomainData"], (ms) => audioMs += ms);
  const raf = requestAnimationFrame.bind(self);
  self.requestAnimationFrame = (cb) => raf((now) => { if (lastRaf) { const g = now - lastRaf; gaps.push(g); worst = Math.max(worst, g); } lastRaf = now; const t = performance.now(); try { cb(now); } finally { const d = performance.now() - t; frameMs += d; frames++; } });
  setInterval(() => {
    const wall = performance.now(), dtWall = (wall - lastWall) / 1000; lastWall = wall;
    const s = self.pub?.sim?.current, t = s?.t ?? -1, ratio = lastT >= 0 && t >= lastT ? (t - lastT) / dtWall : NaN; lastT = t;
    const med = gaps.length ? [...gaps].sort((a, b) => a - b)[gaps.length >> 1] : 0, n = Math.max(1, frames);
    log.push(`game ${Number.isFinite(ratio) ? ratio.toFixed(2) : " -- "}x | frame ${med.toFixed(0)}ms | js ${(frameMs / n).toFixed(1)}: cv ${(canvasMs / n).toFixed(1)} hud ${(htmlMs / n).toFixed(1)} au ${(audioMs / n).toFixed(1)} | busy ${blocked.toFixed(0)}ms/s | resizes ${resizes}`); blocked = 0; resizes = 0;
    if (log.length > (location.search.includes('log') ? 14 : 3)) log.shift();
    box.textContent = (location.search.includes('log') ? `${navigator.userAgent.slice(13, 40)} dpr ${devicePixelRatio}\n` : '') + log.join("\n");
    canvasMs = htmlMs = audioMs = frameMs = 0; frames = 0; gaps = []; worst = 0;
  }, 1000);
})();
</script>
